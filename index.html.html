<style>
/* Layout: one full-screen "archive board" holding the collage; floating glass controls at the edges; welcome, guide, share and credits as overlays. */
:root{
  --board:#dde3e8; --board-line:#ccd4db; --ink:#15202a; --muted:#536371;
  --surface:#f7f9fa; --surface-2:#e9eef1; --river:#1c5c6f; --river-ink:#ffffff;
  --saffron:#d48f17; --scrim:rgba(14,28,38,.58); --shadow:rgba(16,30,42,.18);
  --f-display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#111920; --board-line:#1c2731; --ink:#e5ecf1; --muted:#9bb0bf;
  --surface:#1a242d; --surface-2:#24313b; --river:#5db4ca; --river-ink:#0b1a20;
  --saffron:#ecb245; --scrim:rgba(3,9,13,.72); --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#111920; --board-line:#1c2731; --ink:#e5ecf1; --muted:#9bb0bf;
  --surface:#1a242d; --surface-2:#24313b; --river:#5db4ca; --river-ink:#0b1a20;
  --saffron:#ecb245; --scrim:rgba(3,9,13,.72); --shadow:rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{margin:0;overflow:hidden;position:relative;font-family:var(--f-body);color:var(--ink);
  background:var(--board);
  background-image:linear-gradient(var(--board-line) 1px,transparent 1px),linear-gradient(90deg,var(--board-line) 1px,transparent 1px);
  background-size:48px 48px;}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Stage */
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.dragging{cursor:grabbing}
#svg{display:block;width:100%;height:100%}
.wtitle{fill:var(--ink);font-family:var(--f-display);font-weight:700}
.wline{stroke:var(--ink);stroke-opacity:.35}
.place{cursor:pointer;transition:opacity .45s ease,filter .45s ease}
.place:focus{outline:none}
.place .paper{fill:#fbfaf6}
.hq .place .paper{filter:url(#shadow)}
.place .hl{fill:none;stroke:var(--saffron);stroke-width:0;transition:stroke-width .2s}
.place:hover .hl,.place:focus-visible .hl,.place.focus .hl{stroke-width:6}
.place.dim{opacity:.16}
.hq .place.dim{filter:grayscale(.9)}
.sk{fill:#fff;stroke:#26323d;stroke-width:1.3;stroke-linejoin:round}
.hq .drift{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){.hq .drift{animation:none}.place{transition:none}}

/* Hotspots */
#spots{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  border:2px solid var(--saffron);background:#fffdf7;color:#1c5c6f;display:grid;place-items:center;
  pointer-events:auto;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.spot svg{width:22px;height:22px}
.spot:hover{transform:scale(1.08)}
.spot.active{background:var(--saffron);color:#1a1205}
.spot.layer{width:auto;margin:0;translate:-50% -50%;display:flex;align-items:center;gap:7px;padding:0 16px 0 11px;border-radius:23px;font-weight:600;font-size:14px;white-space:nowrap}
.spot.layer::after{border-radius:30px}
#veil{position:absolute;inset:0;background:var(--board);opacity:0;pointer-events:none;transition:opacity .4s ease}
#veil.on{opacity:1}
.spot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--saffron);opacity:0}
.hq .spot::after{animation:ring 2.2s ease-out infinite}
@keyframes pop{from{transform:scale(0)}}
@keyframes ring{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}

/* Floating chrome */
.glass{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 6px 24px var(--shadow)}
#toolbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  display:flex;gap:2px;padding:4px;border-radius:999px;z-index:20;white-space:nowrap}
#toolbar button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:500}
#toolbar button:hover{background:var(--surface-2)}
#toolbar svg{width:17px;height:17px;flex:none}
#toolbar .sep{width:1px;background:color-mix(in srgb,var(--ink) 14%,transparent);margin:6px 2px}
#crumbs{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:6px;z-index:21;max-width:calc(50% - 200px);min-width:0}
#backBtn{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;font-weight:500;font-size:13.5px;
  background:var(--river);color:var(--river-ink);box-shadow:0 6px 18px var(--shadow)}
#backBtn svg{width:16px;height:16px}
[dir="rtl"] #backBtn svg{transform:scaleX(-1)}
#trail{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#trail b{color:var(--ink);font-weight:600}
#zoom{position:absolute;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 18px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;border-radius:12px;overflow:hidden;z-index:20}
#zoom button{width:44px;height:44px;border:0;background:none;font-size:22px;line-height:1}
#zoom button:hover{background:var(--surface-2)}
#zoom button+button{border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
#creditsTab{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:19;border:0;
  padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0;font-size:13px;font-weight:500}
#creditsTab::before{content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--muted);opacity:.5;margin:0 auto 6px}
#tip{position:absolute;z-index:25;pointer-events:none;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:500;
  background:var(--ink);color:var(--board);transform:translate(-50%,calc(-100% - 14px));white-space:nowrap}
#hint{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));left:50%;transform:translateX(-50%);z-index:18;
  font-size:13px;color:var(--muted);padding:8px 14px;border-radius:999px;transition:opacity .6s}

/* Story card */
#story{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:max(64px,calc(env(safe-area-inset-bottom,0px) + 64px));
  width:min(560px,calc(100% - 32px));border-radius:var(--r);padding:18px 20px 18px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
#story .kind{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--river);font-weight:600}
#story h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:4px 0 8px;text-wrap:balance}
#story blockquote{margin:0;font-size:16px;line-height:1.65}
#story .who{margin-top:10px;font-size:13px;color:var(--muted)}
#story .close{position:absolute;top:10px;inset-inline-end:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px;line-height:1}
.player{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.play{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 12px;background:var(--river);color:var(--river-ink);font-weight:600;font-size:14px}
.play svg{width:18px;height:18px}
.bar{flex:1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--saffron);transition:width .25s linear}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.transcript{color:var(--muted)}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.card{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(480px,100%);padding:24px;position:relative}
.card h2{font-family:var(--f-display);font-size:24px;margin:0 0 8px;text-wrap:balance}
.card p{line-height:1.65;margin:0 0 12px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--river);color:var(--river-ink)}
.btn.ghost{background:var(--surface-2)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* Welcome */
#welcome{position:absolute;inset:0;z-index:60;overflow-y:auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--board) 82%,transparent),color-mix(in srgb,var(--board) 96%,transparent) 55%);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#welcome .inner{max-width:660px;margin:0 auto;padding:max(76px,calc(env(safe-area-inset-top,0px) + 60px)) max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--river);font-weight:600}
.sample{display:inline-block;margin-inline-start:8px;padding:2px 8px;border-radius:6px;background:var(--saffron);color:#1a1205;letter-spacing:.04em}
#welcome h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,8vw,68px);line-height:1.05;margin:0;text-wrap:balance}
#welcome .lead p{font-size:17px;line-height:1.7;margin:0 0 12px;max-width:62ch}
#welcome .start{align-self:flex-start;display:flex;align-items:center;gap:10px;font-size:17px;padding:15px 26px}
#welcome .start svg{width:20px;height:20px}
[dir="rtl"] #welcome .start svg{transform:scaleX(-1)}
.fine{border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);padding-top:18px;font-size:13.5px;color:var(--muted);line-height:1.65}
.fine h3{font-size:13px;color:var(--ink);margin:0 0 4px;font-weight:600}
.fine p{margin:0 0 12px}
.mail{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mail code{font-family:var(--f-body);font-size:14px;background:var(--surface-2);color:var(--ink);padding:6px 10px;border-radius:8px;user-select:all;-webkit-user-select:all}
.mail button{border:0;background:none;color:var(--river);font-weight:600;font-size:13px;padding:6px}
.logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.logos div{height:52px;border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.langSwitch{position:fixed;top:max(16px,env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));display:flex;padding:3px;border-radius:999px;z-index:61}
.langSwitch button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500}
.langSwitch button[aria-pressed="true"]{background:var(--river);color:var(--river-ink)}

/* Guide */
.gicons{display:flex;gap:10px;justify-content:center;margin:6px 0 16px}
.gicons span{width:52px;height:52px;border-radius:14px;background:var(--surface-2);color:var(--river);display:grid;place-items:center}
.gicons svg{width:26px;height:26px}
.gtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.gtop button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:4px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--river);width:20px;border-radius:4px}
.gnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Credits sheet */
#credits{position:absolute;z-index:55;left:50%;bottom:0;transform:translateX(-50%);width:min(860px,100%);max-height:78%;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:26px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));animation:sheet .35s ease both}
@keyframes sheet{from{transform:translate(-50%,40px);opacity:0}}
#credits h2{font-family:var(--f-display);font-size:26px;margin:0 0 6px}
#credits .sub{color:var(--muted);line-height:1.6;margin:0 0 18px;max-width:62ch}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px}
.teams h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--river);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.teams ul{list-style:none;margin:0;padding:0;line-height:1.9;font-size:14px}
#credits .close{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px}

#toast{position:absolute;z-index:70;top:max(70px,calc(env(safe-area-inset-top,0px) + 64px));left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:10px;
  background:var(--ink);color:var(--board);font-size:13.5px;max-width:calc(100% - 32px);text-align:center;animation:fade .25s ease both}

@media (min-width:900px){
  #story{left:auto;bottom:auto;top:50%;inset-inline-end:max(20px,env(safe-area-inset-right,0px));width:360px;transform:translateY(-50%);animation-name:riseSide}
  @keyframes riseSide{from{opacity:0;transform:translateY(calc(-50% + 12px))}}
}
@media (max-width:760px){
  body.story-open #zoom{display:none}
  #toolbar .lbl{display:none}
  #toolbar button{padding:9px 11px}
  #crumbs{max-width:none;top:auto;bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 18px))}
  #trail{display:none}
  #story{bottom:max(76px,calc(env(safe-area-inset-bottom,0px) + 76px))}
  #creditsTab{display:none}
}
</style>

/* ---------- Drawing helpers (original placeholder artwork) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const f1=n=>Math.round(n*10)/10;
const STONE=['#e3d4b4','#d7c49e','#cab48b','#eadfc6','#c2a981','#ddd0b8','#d2bfa0'];
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function rect(x,y,w,h,f,ex){return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="${f}" ${ex||''}/>`;}
function bld(r,x,y,w,h,col,lit){
  let s=rect(x,y,w,h,col)+rect(x-2,y-4,w+4,5,'#9c8662');
  const cols=Math.max(1,Math.round(w/30)),rows=Math.max(1,Math.round(h/36));
  const ww=Math.min(12,w/cols*.42),wh=Math.min(16,h/rows*.42);
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){ if(r()<.8) s+=rect(x+(j+.5)*w/cols-ww/2,y+(i+.32)*h/rows,ww,wh,r()<(lit||0)?'#f2c560':'#3e4c57','rx="1.5"'); }
  return s;
}
function tree(x,y,s,r){const c=['#5a8a3a','#6d9c49','#48722f'];return `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><rect x="-3" y="-26" width="6" height="28" fill="#6b4f35"/><circle cx="-10" cy="-34" r="15" fill="${pick(r,c)}"/><circle cx="10" cy="-36" r="16" fill="${pick(r,c)}"/><circle cx="0" cy="-50" r="16" fill="${pick(r,c)}"/></g>`;}
function palm(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})" stroke="#3f6b2c" stroke-width="5" stroke-linecap="round" fill="none"><path d="M0 0 Q4 -40 2 -80" stroke="#7a5a3a" stroke-width="6"/><path d="M2 -80 q-22 -6 -34 8M2 -80 q22 -8 34 6M2 -80 q-10 -20 -30 -22M2 -80 q12 -20 30 -20M2 -80 q0 -18 -4 -30"/></g>`;}
function person(x,y,s,pose){
  const body=pose==='sit'?'M-9 -14 Q0 -20 9 -14 L11 6 L-11 6 Z':pose==='kid'?'M-6 -20 Q0 -24 6 -20 L8 2 L3 2 L2 16 L-2 16 L-3 2 L-8 2 Z':'M-8 -26 Q0 -31 8 -26 L10 2 L4 2 L3 24 L-3 24 L-4 2 L-10 2 Z';
  const hy=pose==='sit'?-22:pose==='kid'?-27:-34;
  return `<g class="sk" transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><path d="${body}"/><circle cx="0" cy="${hy}" r="6.5"/></g>`;}
function cloud(x,y,s){return `<g class="drift"><g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".85"><ellipse cx="0" cy="0" rx="34" ry="12"/><ellipse cx="18" cy="-8" rx="20" ry="12"/><ellipse cx="-14" cy="-6" rx="16" ry="10"/></g></g>`;}
function birds(x,y){return `<g class="drift" fill="none" stroke="#2b3742" stroke-width="2" stroke-linecap="round"><path d="M${x} ${y} q5 -5 10 0 q5 -5 10 0"/><path d="M${x+34} ${y-14} q4 -4 8 0 q4 -4 8 0"/><path d="M${x+18} ${y+16} q4 -4 8 0 q4 -4 8 0"/></g>`;}
function stripes(x,y,w,h,n,a,b){let s='';for(let i=0;i<n;i++){const x0=x+w*i/n,x1=x+w*(i+1)/n;s+=`<polygon points="${f1(x0)},${y} ${f1(x1)},${y} ${f1(x1+ (i-n/2+1)*3)},${y+h} ${f1(x0+(i-n/2)*3)},${y+h}" fill="${i%2?b:a}"/>`;}return s;}

function sBridge(w,h,r){
  const deck=h*.3,base=h*.6; let s=rect(0,0,w,base+10,'url(#skyDusk)')+cloud(w*.2,h*.1,1.2)+cloud(w*.7,h*.07,.9);

  s+=`<path d="M0 ${f1(h*.64)} C${f1(w*.2)} ${f1(h*.6)} ${f1(w*.42)} ${f1(h*.8)} ${f1(w*.6)} ${h} L0 ${h} Z" fill="#5f8f45"/>`;
  for(let i=0;i<70;i++){const x=r()*w*.48,y=h*.72+r()*h*.28; if(y>h*.64+ (x/(w*.6))*(h*.36)) s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(3+r()*3)}" fill="#d63a2c"/>`;}

  return s;
}

  s+=`<path d="M${f1(w*.44)} ${f1(h*.32)} C${f1(w*.38)} ${f1(h*.55)} ${f1(w*.2)} ${f1(h*.75)} ${f1(w*.18)} ${h}" stroke="#c8b38a" stroke-width="16" fill="none"/>`;

function sHouses(w,h,r){

/* ---------- Render ---------- */
function torn(w,h,seed,pad){const r=rng(seed);const pts=[],step=24,j=()=>(r()-.5)*7;
  for(let x=0;x<w;x+=step)pts.push([x,j()]);for(let y=0;y<h;y+=step)pts.push([w+j(),y]);
  for(let x=w;x>0;x-=step)pts.push([x,h+j()]);for(let y=h;y>0;y-=step)pts.push([j(),y]);
  return pts.map(p=>f1(p[0]-pad)+','+f1(p[1]-pad)).join(' ');}
function renderScene(){
  const sc=scene(); let s='';
  s+=`<text class="wtitle" x="${sc.titleAt[0]}" y="${sc.titleAt[1]}" text-anchor="middle" font-size="76">${sc.title[st.lang]}</text>`;
  s+=`<line class="wline" x1="40" y1="${sc.h-40}" x2="${sc.w-40}" y2="${sc.h-40}" stroke-width="2"/>`;
  sc.places.forEach((p,i)=>{
    const seed=(i+1)*977+p.id.length*31, outer=torn(p.w+18,p.h+18,seed+5,9), inner=torn(p.w,p.h,seed,0);
    s+=`<g class="place" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.name[st.lang]}" transform="translate(${p.x} ${p.y}) rotate(${p.rot} ${p.w/2} ${p.h/2})">`+
       `<clipPath id="c-${p.id}"><polygon points="${inner}"/></clipPath>`+
       `<polygon class="paper" points="${outer}"/>`+
       `<g clip-path="url(#c-${p.id})">${p.draw(p.w,p.h,rng(seed))}</g>`+
       `<polygon class="hl" points="${outer}"/></g>`;
  });
  world.innerHTML=s;
  world.querySelectorAll('.place').forEach(g=>{
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlace(g.dataset.id);}});
  });
}
function placeById(id){return scene().places.find(p=>p.id===id);}
function toWorld(p,fx,fy){const a=p.rot*Math.PI/180,lx=fx*p.w-p.w/2,ly=fy*p.h-p.h/2;
  return [p.x+p.w/2+lx*Math.cos(a)-ly*Math.sin(a), p.y+p.h/2+lx*Math.sin(a)+ly*Math.cos(a)];}

/* ---------- Camera ---------- */
function vw(){return stage.clientWidth} function vh(){return stage.clientHeight}
function apply(){if(!st.transit)clampCam();world.setAttribute('transform',`translate(${f1(cam.x)} ${f1(cam.y)}) scale(${cam.k.toFixed(4)})`);placeSpots();}
function fitK(){const sc=scene();return Math.min((vw()-48)/sc.w,(vh()-120)/sc.h);}
function clampCam(){const sc=scene(),k0=fitK();cam.k=Math.max(k0*.75,Math.min(k0*7,cam.k));
  const W=sc.w*cam.k,H=sc.h*cam.k,m=90;
  const minX=Math.min(m,vw()-W-m),maxX=Math.max(m,vw()-W-m),minY=Math.min(m,vh()-H-m),maxY=Math.max(m,vh()-H-m);
  cam.x=Math.max(minX,Math.min(maxX,cam.x));cam.y=Math.max(minY,Math.min(maxY,cam.y));}
function fitRect(x,y,w,h,bottom,side){side=side||0;const top=70,avH=vh()-top-bottom-24,avW=vw()-56-side;const k=Math.min(avW/w,avH/h);
  const startSide=document.documentElement.dir==='rtl'; // the story panel sits on the inline-end side
  const cx=startSide?side+(vw()-side)/2:(vw()-side)/2;
  return{k,x:cx-(x+w/2)*k,y:top+avH/2+12-(y+h/2)*k};}
function fitPlace(p){const wide=vw()>=900;return fitRect(p.x,p.y,p.w,p.h,wide?40:330,wide?400:0);}
function fitScene(){const sc=scene();return fitRect(0,0,sc.w,sc.h,40);}
let anim=null;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateTo(tg,ms,done){cancelAnimationFrame(anim);
  if(reduced()||!ms){Object.assign(cam,tg);apply();if(done)done();return;}
  const a={...cam},t0=performance.now(),ease=u=>1-Math.pow(1-u,3);
  const lk0=Math.log(a.k),lk1=Math.log(tg.k);
  const step=now=>{const u=Math.min(1,(now-t0)/ms),e=ease(u);const k=Math.exp(lk0+(lk1-lk0)*e);
    // interpolate the world point at screen centre so zooming feels anchored
    const cx0=(vw()/2-a.x)/a.k,cy0=(vh()/2-a.y)/a.k,cx1=(vw()/2-tg.x)/tg.k,cy1=(vh()/2-tg.y)/tg.k;
    const cx=cx0+(cx1-cx0)*e,cy=cy0+(cy1-cy0)*e;cam.k=k;cam.x=vw()/2-cx*k;cam.y=vh()/2-cy*k;apply();
    if(u<1)anim=requestAnimationFrame(step);else if(done)done();};
  anim=requestAnimationFrame(step);}
function zoomAt(px,py,f){const k=cam.k*f,wx=(px-cam.x)/cam.k,wy=(py-cam.y)/cam.k;cam.k=k;clampCam();cam.x=px-wx*cam.k;cam.y=py-wy*cam.k;apply();}

function buildSpots(){
  spotsEl.innerHTML=''; const p=placeById(st.focus); if(!p) return;
  p.spots.forEach((sp,i)=>{const b=document.createElement('button');b.className='spot'+(sp.t==='layer'?' layer':'');

/* Audio: real file if provided, otherwise the device's speech voice as a placeholder */
let audioEl=null,utter=null,fakeTimer=null;
function stopAudio(){if(audioEl){audioEl.pause();audioEl=null;}try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}utter=null;clearInterval(fakeTimer);}
function openStory(p,sp,btn){
  stopAudio(); spotsEl.querySelectorAll('.spot').forEach(b=>b.classList.toggle('active',b===btn));
  st.story={place:p.id,spot:p.spots.indexOf(sp)}; renderStory();
}
function renderStory(){
  const el=$('#story'); if(!st.story){el.hidden=true;return;}
  const p=placeById(st.story.place),sp=p.spots[st.story.spot],S=STORIES[sp.s];
  const canTts=('speechSynthesis' in window)||S.audio;
  let h=`<button class="close" aria-label="${t('close')}">✕</button><div class="kind">${t('kind_'+sp.t)}</div><h2>${p.name[st.lang]}</h2>`;
  if(sp.t==='audio'){
    h+= canTts?`<div class="player"><button class="play" id="playBtn">${ICONS.play}<span>${t('listen')}</span></button><div class="bar"><i id="prog"></i></div></div>`:`<p class="note">${t('noTts')}</p>`;
    h+=`<blockquote class="transcript">“${S[st.lang]}”</blockquote><div class="who">${S.who[st.lang]}</div>`;
    if(canTts&&!S.audio) h+=`<p class="note">${t('ttsNote')}</p>`;
  } else h+=`<blockquote>“${S[st.lang]}”</blockquote><div class="who">— ${S.who[st.lang]}</div>`;
  el.innerHTML=h; el.hidden=false; document.body.classList.add('story-open'); el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  el.querySelector('.close').onclick=closeStory;
  const pb=el.querySelector('#playBtn'); if(pb) pb.onclick=()=>togglePlay(S,pb);
}
function setPlayBtn(pb,playing,ended){pb.innerHTML=(playing?ICONS.pause:ICONS.play)+`<span>${playing?t('pause'):ended?t('replay'):t('listen')}</span>`;}
function togglePlay(S,pb){
  const prog=$('#prog');
  if(S.audio){ if(!audioEl){audioEl=new Audio(S.audio);audioEl.ontimeupdate=()=>{if(audioEl&&audioEl.duration)prog.style.width=(audioEl.currentTime/audioEl.duration*100)+'%';};audioEl.onended=()=>{setPlayBtn(pb,false,true);audioEl=null;};}
    if(audioEl.paused){audioEl.play().catch(()=>{});setPlayBtn(pb,true);}else{audioEl.pause();setPlayBtn(pb,false);} return; }
  const ss=window.speechSynthesis;
  if(utter&&ss.speaking&&!ss.paused){ss.pause();setPlayBtn(pb,false);clearInterval(fakeTimer);return;}
  if(utter&&ss.paused){ss.resume();setPlayBtn(pb,true);return;}
  const text=S[st.lang]; utter=new SpeechSynthesisUtterance(text); utter.lang=st.lang==='ar'?'ar-SA':'en-GB'; utter.rate=.95;
  const v=ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(st.lang)); if(v) utter.voice=v;
  let pos=0; const est=text.length*65; const t0=Date.now();
  utter.onboundary=e=>{pos=e.charIndex;prog.style.width=Math.min(100,pos/text.length*100)+'%';};
  fakeTimer=setInterval(()=>{if(!pos)prog.style.width=Math.min(95,(Date.now()-t0)/est*100)+'%';},200);
  utter.onend=()=>{clearInterval(fakeTimer);prog.style.width='100%';setPlayBtn(pb,false,true);utter=null;};
  utter.onerror=()=>{clearInterval(fakeTimer);setPlayBtn(pb,false);utter=null;};
  ss.cancel(); ss.speak(utter); setPlayBtn(pb,true);
}
function closeStory(){stopAudio();st.story=null;$('#story').hidden=true;document.body.classList.remove('story-open');spotsEl.querySelectorAll('.spot').forEach(b=>b.classList.remove('active'));}

/* Nested collages: zoom through the clicked point (a door, a shop) into the scene behind it, and back out the same way */
function veil(on){$('#veil').classList.toggle('on',on);}
function enterScene(name,pt){
  closeStory(); spotsEl.innerHTML='';
  const arrive=()=>{st.transit=false;st.scene=name;st.focus=null;renderScene();const f=fitScene();Object.assign(cam,{...f,k:f.k*.55});apply();veil(false);animateTo(f,750);updateChrome();};
  if(!pt||reduced()){arrive();return;}
  st.transit=true; const k=cam.k*7;
  animateTo({k,x:vw()/2-pt[0]*k,y:vh()/2-pt[1]*k},700,arrive); setTimeout(()=>veil(true),300);
}
function goBack(){
  if(st.story){closeStory();return;}
  if(st.focus){unfocus();return;}
  const sc=scene(); if(!sc.parent) return;
  const child=st.scene,from=sc.from;
  const leave=()=>{
    st.scene=sc.parent; renderScene(); const p=placeById(from); st.focus=from;
    world.querySelectorAll('.place').forEach(g=>{g.classList.toggle('dim',g.dataset.id!==from);g.classList.toggle('focus',g.dataset.id===from);});
    const sp=p.spots.find(x=>x.t==='layer'&&x.s===child),pt=toWorld(p,sp.fx,sp.fy),tg=fitPlace(p),k=tg.k*7;
    st.transit=true; Object.assign(cam,{k,x:vw()/2-pt[0]*k,y:vh()/2-pt[1]*k}); apply(); veil(false);
    buildSpots(); updateChrome(); animateTo(tg,reduced()?0:750,()=>{st.transit=false;});
  };
  if(reduced()){leave();return;}
  veil(true); const f=fitScene(); animateTo({...f,k:f.k*.6},420); setTimeout(leave,430);
}

/* ---------- Input ---------- */
const ptrs=new Map(); let drag=null,pinch=null,moved=0;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.spot'))return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(anim);
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,target:e.target};moved=0;}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cam.k,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;moved=99;}});
stage.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=stage.getBoundingClientRect();zoomAt(pinch.mx-r.left,pinch.my-r.top,(pinch.k*d/pinch.d)/cam.k);return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>5){stage.classList.add('dragging');cam.x=drag.cx+dx;cam.y=drag.cy+dy;apply();$('#tip').hidden=true;}return;}
  const g=e.target.closest&&e.target.closest('.place'); const tip=$('#tip');
  if(g&&e.pointerType==='mouse'&&g.dataset.id!==st.focus){const p=placeById(g.dataset.id);tip.textContent=p.name[st.lang];tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.hidden=false;}else tip.hidden=true;});
function endPtr(e){ptrs.delete(e.pointerId);stage.classList.remove('dragging');
  if(drag&&moved<=5&&e.type==='pointerup'){const g=drag.target.closest&&drag.target.closest('.place');if(g){g.dataset.id===st.focus?null:openPlace(g.dataset.id);}else if(st.focus)unfocus();}

stage.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015));},{passive:false});
$('#zin').onclick=()=>{cancelAnimationFrame(anim);zoomAt(vw()/2,vh()/2,1.35);};
$('#zout').onclick=()=>{cancelAnimationFrame(anim);zoomAt(vw()/2,vh()/2,1/1.35);};
$('#backBtn').onclick=goBack;
$('#shareBtn').onclick=()=>{$('#share').hidden=false;$('#shareClose').focus();};
$('#shareClose').onclick=()=>$('#share').hidden=true;
$('#qualityBtn').onclick=()=>setQuality(st.quality==='high'?'low':'high',true);
document.querySelectorAll('.langSwitch button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$('#creditsTab').onclick=()=>{$('#credits').hidden=false;$('#creditsClose').focus();};
$('#creditsClose').onclick=()=>$('#credits').hidden=true;
['#share','#guide'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id)){id==='#guide'?closeGuide():$(id).hidden=true;}}));
document.querySelectorAll('.copyMail').forEach(b=>b.onclick=()=>{const code=b.parentElement.querySelector('code'),txt=code.textContent;
  const done=()=>{b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1800);};
  const sel=()=>{const rg=document.createRange();rg.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(rg);};
  try{navigator.clipboard.writeText(txt).then(done,sel);}catch(e){sel();}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#guide').hidden){closeGuide();return;} if(!$('#share').hidden){$('#share').hidden=true;return;} if(!$('#credits').hidden){$('#credits').hidden=true;return;}
  if(st.started)goBack();});
addEventListener('resize',()=>{if(!st.started){Object.assign(cam,fitScene());apply();return;}
  const p=st.focus&&placeById(st.focus);Object.assign(cam,p?fitPlace(p):fitScene());apply();});

/* ---------- Start ---------- */
function measureFps(){let n=0;const t0=performance.now();const tick=now=>{n++;if(now-t0<2200)requestAnimationFrame(tick);else{const fps=n/((now-t0)/1000);if(fps<28&&!st.qualityManual&&st.quality==='high'){setQuality('low');toast(t('lowSwitch'));}}};requestAnimationFrame(tick);}
$('#startBtn').onclick=()=>{
  st.started=true; $('#welcome').hidden=true;
  ['#toolbar','#zoom','#creditsTab','#crumbs','#hint'].forEach(s=>$(s).hidden=false);
  updateChrome(); const f=fitScene(); Object.assign(cam,{...f,k:f.k*.82}); apply(); animateTo(f,900); measureFps();
  setTimeout(hideHint,9000);
};

/* ---------- Boot ---------- */
function showFail(){const f=$('#fail');if(f){f.hidden=false;}}
addEventListener('error',e=>{if(e.message&&!/ResizeObserver/.test(e.message))showFail();});
setQuality('high'); applyLang(); renderScene(); Object.assign(cam,fitScene()); apply();
})();
</script>

</body></html>
